name: CI
on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    shell: bash -xeo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mysql_label: "8.0"
            mysql_port: 3306
            upload_codecov: true
          - mysql_label: "9.4"
            mysql_port: 3307
            upload_codecov: false
    name: test (mysql ${{ matrix.mysql_label }})
    env:
      MYSQL_PORT: ${{ matrix.mysql_port }}
      MYSCHEMA_TEST_DSN: "root@tcp(127.0.0.1:${{ matrix.mysql_port }})/"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
      - name: Start MySQL
        run: |
          for i in {1..60}; do docker compose up -d --quiet-pull && break; sleep 1; done
          # Use bash's standard timeout idiom instead of a fixed-iteration
          # loop: if the server never comes up, `timeout` returns non-zero
          # and the step fails.
          timeout 120 bash -c 'until mysqladmin ping -h 127.0.0.1 -P "${{ matrix.mysql_port }}" -u root --silent; do sleep 2; done'
      - run: make TEST_OPTS='-coverprofile=coverage.txt'
      - run: make test-scenario
      - if: ${{ matrix.upload_codecov }}
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
