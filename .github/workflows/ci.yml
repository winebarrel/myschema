name: CI
on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    shell: bash -xeo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mysql_label: "8"
            mysql_service: mysql8
            mysql_port: 3306
          - mysql_label: "9"
            mysql_service: mysql9
            mysql_port: 3307
    name: test (mysql ${{ matrix.mysql_label }})
    env:
      MYSQL_PORT: ${{ matrix.mysql_port }}
      MYSCHEMA_TEST_DSN: "root@tcp(127.0.0.1:${{ matrix.mysql_port }})/"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
      - name: Start MySQL
        run: |
          docker compose up -d --quiet-pull "${{ matrix.mysql_service }}"
          # Use bash's standard timeout idiom: if the server never comes
          # up, `timeout` returns non-zero and the step fails.
          timeout 120 bash -c 'until mysqladmin ping -h 127.0.0.1 -P "${{ matrix.mysql_port }}" -u root --silent; do sleep 2; done'
      - run: make TEST_OPTS='-coverprofile=coverage.txt'
      - run: make test-scenario
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.mysql_service }}

  deadcode:
    runs-on: ubuntu-latest
    name: deadcode
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: make deadcode
