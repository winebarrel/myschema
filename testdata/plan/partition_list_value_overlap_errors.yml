# Pin that the diff layer surfaces a clearer error when the
# desired LIST partition definitions assign the same value to
# more than one partition. This is fundamentally an invalid
# desired schema (MySQL forbids the same LIST constant in
# multiple partitions — Error 1495 "Multiple definition of
# same constant in list partitioning"), but the
# `partitionListChangedSlotsAreSuperset` per-run gate would
# otherwise let it through (the changed slot's NEW set is a
# superset of OLD, so per-run emits `REORGANIZE p0 INTO
# (p0 IN (1, 4))` while unchanged p3 still owns 4 — fails on
# apply with Error 1495). The pre-flight check catches the
# overlap at plan time so the operator gets actionable
# feedback before any ALTER is run.
init: |
  CREATE TABLE accts (
      id INT NOT NULL,
      region INT NOT NULL,
      PRIMARY KEY (id, region)
  ) PARTITION BY LIST (region) (
      PARTITION p0 VALUES IN (1),
      PARTITION p1 VALUES IN (2),
      PARTITION p3 VALUES IN (4)
  );

desired: |
  CREATE TABLE accts (
      id INT NOT NULL,
      region INT NOT NULL,
      PRIMARY KEY (id, region)
  ) PARTITION BY LIST (region) (
      PARTITION p0 VALUES IN (1, 4),
      PARTITION p1 VALUES IN (2),
      PARTITION p3 VALUES IN (4)
  );

error: 'desired LIST partition definitions assign value 4 to both partition p0 and partition p3'
