# LIST COLUMNS counterpart to the scalar-LIST permutation
# regression. `temporarilySortListValues` runs for every
# `InType` ValueRange — including LIST COLUMNS where each
# element of `Range` is a tuple — but the only existing
# permutation pin uses scalar LIST. Without this fixture, a
# regression in the formatter or in the sort comparator (e.g.
# inconsistent tuple-vs-scalar formatting) could reintroduce
# a spurious data-moving REORGANIZE on the LIST COLUMNS
# variant without tripping the suite. Pins `((1,1),(2,2)) →
# ((2,2),(1,1))` (and the same for p1) as `plan: ""`.
init: |
  CREATE TABLE accts (
      a INT NOT NULL,
      b INT NOT NULL,
      PRIMARY KEY (a, b)
  ) PARTITION BY LIST COLUMNS(a, b) (
      PARTITION p0 VALUES IN ((1, 1), (2, 2)),
      PARTITION p1 VALUES IN ((3, 3), (4, 4))
  );

desired: |
  CREATE TABLE accts (
      a INT NOT NULL,
      b INT NOT NULL,
      PRIMARY KEY (a, b)
  ) PARTITION BY LIST COLUMNS(a, b) (
      PARTITION p0 VALUES IN ((2, 2), (1, 1)),
      PARTITION p1 VALUES IN ((4, 4), (3, 3))
  );

plan: ""
