# Mid-list partition mismatch (catalog and desired share no common
# prefix at index 0 — the value of p2020 differs). Not a pure
# suffix add or drop, so the diff layer can't generate ADD/DROP
# safely without reorganising the data. v1 errors out and asks the
# user to run REORGANIZE PARTITION by hand.
init: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      dt DATE NOT NULL,
      PRIMARY KEY (id, dt)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2020 VALUES LESS THAN (2021),
      PARTITION p2021 VALUES LESS THAN (2022)
  );

desired: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      dt DATE NOT NULL,
      PRIMARY KEY (id, dt)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2020 VALUES LESS THAN (2025),
      PARTITION p2021 VALUES LESS THAN (2026)
  );

error: "REORGANIZE PARTITION generation is not yet implemented"
