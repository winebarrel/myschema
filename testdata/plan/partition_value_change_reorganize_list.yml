# LIST counterpart to partition_value_change_reorganize. Same
# REORGANIZE PARTITION code path, but the value clause is
# `VALUES IN (...)` instead of `VALUES LESS THAN (...)`.
init: |
  CREATE TABLE accts (
      id INT NOT NULL,
      region INT NOT NULL,
      PRIMARY KEY (id, region)
  ) PARTITION BY LIST (region) (
      PARTITION pAB VALUES IN (1, 2),
      PARTITION pCD VALUES IN (3, 4)
  );

desired: |
  CREATE TABLE accts (
      id INT NOT NULL,
      region INT NOT NULL,
      PRIMARY KEY (id, region)
  ) PARTITION BY LIST (region) (
      PARTITION pAB VALUES IN (1, 2, 7),
      PARTITION pCD VALUES IN (3, 4, 8)
  );

plan: |
  ALTER TABLE accts REORGANIZE PARTITION pAB, pCD INTO (
    partition pAB values in (1, 2, 7),
    partition pCD values in (3, 4, 8)
  );
