# Verifies the invariant that DiffTables.FKDropStmts run before *any*
# table drop, not just before the parent of the FK. The catalog returns
# tables ordered by TABLE_NAME — so in this specific fixture the child
# (`posts`) happens to drop first, which would in fact succeed without
# an explicit FK drop. The point of the assertion isn't to "rescue"
# this fixture; it's to pin the bucket separation
# (FKDropStmts → … → DropStmts) so the plan is robust under any future
# DROP-order change (e.g. drops sorted in a different way) and against
# variants where the parent comes first alphabetically.
init: |
  CREATE TABLE users (id BIGINT NOT NULL, PRIMARY KEY (id));
  CREATE TABLE posts (
      id BIGINT NOT NULL,
      user_id BIGINT NOT NULL,
      PRIMARY KEY (id),
      CONSTRAINT fk FOREIGN KEY (user_id) REFERENCES users(id)
  );

desired: ""

allow_drop:
  - table

plan: |
  ALTER TABLE myschema_test.posts DROP FOREIGN KEY fk;
  DROP TABLE myschema_test.posts;
  DROP TABLE myschema_test.users;
