# Counterpart to partition_key_rename_implicit_scheme_change_errors
# but for `PARTITION BY KEY (col)`, where the partition column
# lives in `PartitionOption.ColList`. Same outcome: renaming the
# partition column changes the desired-side ColList relative to
# the catalog (`KEY(old_owner)` → `KEY(owner)`) so the diff
# raises "scheme/expression differs" — the user can't actually
# RENAME COLUMN against a partition-key column anyway (MySQL
# Error 3855), so the REMOVE PARTITIONING + new PARTITION BY
# workaround the error message points at is the right answer.
init: |
  CREATE TABLE shards (
      id BIGINT NOT NULL,
      old_owner BIGINT NOT NULL,
      PRIMARY KEY (id, old_owner)
  ) PARTITION BY KEY (old_owner) PARTITIONS 4;

desired: |
  CREATE TABLE shards (
      id BIGINT NOT NULL,
      -- myschema:renamed-from old_owner
      owner BIGINT NOT NULL,
      PRIMARY KEY (id, owner)
  ) PARTITION BY KEY (owner) PARTITIONS 4;

error: "partition strategy / expression differs"
