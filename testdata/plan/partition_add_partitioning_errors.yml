# Pin the "desired adds partitioning to an unpartitioned catalog
# table" error path. Counterpart to partition_remove_partitioning_errors.
# The remediation message must point at PARTITION BY (the operation
# the user actually needs), not REMOVE PARTITIONING.
init: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      dt DATE NOT NULL,
      PRIMARY KEY (id, dt)
  );

desired: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      dt DATE NOT NULL,
      PRIMARY KEY (id, dt)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2020 VALUES LESS THAN (2021)
  );

error: "first-time ALTER TABLE … PARTITION BY … is not yet generated"
