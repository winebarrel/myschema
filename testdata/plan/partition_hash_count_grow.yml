# HASH count grow: catalog PARTITIONS 4, desired PARTITIONS 8
# → ALTER TABLE … ADD PARTITION PARTITIONS 4. Adds the
# difference (8 - 4); MySQL has to redistribute existing rows
# across the wider modulus during the ALTER (data-moving but
# row-preserving). No allow-drop gating because no slot is
# being removed.
init: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      PRIMARY KEY (id)
  ) PARTITION BY HASH (id) PARTITIONS 4;

desired: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      PRIMARY KEY (id)
  ) PARTITION BY HASH (id) PARTITIONS 8;

plan: |
  ALTER TABLE myschema_test.events ADD PARTITION PARTITIONS 4;
