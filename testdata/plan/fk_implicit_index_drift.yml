# Spec test: pins the documented FK-implicit-index limitation
# (see AGENTS.md "Not yet implemented" section).
#
# When a foreign key is added on un-indexed columns — inline in
# CREATE TABLE (as below) or via ALTER TABLE … ADD CONSTRAINT …
# FOREIGN KEY — MySQL silently creates a covering index named after
# the FK constraint. The catalog reads it back as an ordinary index
# because information_schema.STATISTICS doesn't flag it as implicit.
# With desired SQL declaring
# the FK but not the index, plan reports false drift: a suppressed
# DROP INDEX. (Apply with --allow-drop=index would fail — MySQL
# guards the index with Error 1553 while the FK still needs it.)
#
# When this fixture starts failing — specifically, when the assertion
# below stops matching because `disallowed_drops` is no longer
# emitted — the diff-side suppression rule has been added; delete
# this fixture and the limitation note in AGENTS.md.
init: |
  CREATE TABLE users (id BIGINT NOT NULL, PRIMARY KEY (id));
  CREATE TABLE posts (
      id BIGINT NOT NULL,
      user_id BIGINT NOT NULL,
      PRIMARY KEY (id),
      CONSTRAINT fk_posts_user FOREIGN KEY (user_id) REFERENCES users(id)
  );

desired: |
  CREATE TABLE users (id BIGINT NOT NULL, PRIMARY KEY (id));
  CREATE TABLE posts (
      id BIGINT NOT NULL,
      user_id BIGINT NOT NULL,
      PRIMARY KEY (id),
      CONSTRAINT fk_posts_user FOREIGN KEY (user_id) REFERENCES users(id)
  );

# allow_drop omitted → DROP INDEX surfaced as -- skipped:
plan: ""
disallowed_drops: |
  -- skipped: ALTER TABLE myschema_test.posts DROP INDEX fk_posts_user;
