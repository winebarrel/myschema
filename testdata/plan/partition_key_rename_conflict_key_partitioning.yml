# Counterpart to partition_key_rename_conflict_errors but for
# `PARTITION BY KEY (col)` — the partition column lives in
# `PartitionOption.ColList` (not `Expr`), so the conflict
# detector's ColList fallback is what rejects this case. Without
# this fixture, a regression to the ColList path could quietly
# allow a RENAME COLUMN that MySQL would reject (Error 3855) at
# apply time.
init: |
  CREATE TABLE shards (
      id BIGINT NOT NULL,
      old_owner BIGINT NOT NULL,
      PRIMARY KEY (id, old_owner)
  ) PARTITION BY KEY (old_owner) PARTITIONS 4;

desired: |
  CREATE TABLE shards (
      id BIGINT NOT NULL,
      -- myschema:renamed-from old_owner
      owner BIGINT NOT NULL,
      PRIMARY KEY (id, owner)
  ) PARTITION BY KEY (owner) PARTITIONS 4;

error: "conflict with the partition expression"
