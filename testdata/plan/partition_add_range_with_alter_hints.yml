# Pin the global appendAlterHints rewrite as it applies to a
# partition ADD PARTITION statement. MySQL's parser rejects
# the trailing-comma form on partition operations (Error 1064
# — the comma after the closing `)` of the partition list is
# treated as a new partition_definition), so the hint inserter
# splices the clauses *between the table name and the
# partition-op keyword* instead, producing
# `ALTER TABLE t ALGORITHM=…, LOCK=…, ADD PARTITION (…)`.
# Without this fixture, a future format tweak to the ADD
# PARTITION builder (or to appendAlterHints) could quietly
# break the splice point and ship invalid SQL to MySQL.
# `testdata/apply/partition_add_range_with_alter_hints.yml` is
# the apply counterpart that confirms MySQL actually accepts
# the corrected form.
init: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      dt DATE NOT NULL,
      PRIMARY KEY (id, dt)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2020 VALUES LESS THAN (2021)
  );

desired: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      dt DATE NOT NULL,
      PRIMARY KEY (id, dt)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2020 VALUES LESS THAN (2021),
      PARTITION p2021 VALUES LESS THAN (2022)
  );

alter_algorithm: INPLACE
alter_lock: NONE

plan: |
  ALTER TABLE events ALGORITHM=INPLACE, LOCK=NONE, ADD PARTITION (
    partition p2021 values less than (2022)
  );
