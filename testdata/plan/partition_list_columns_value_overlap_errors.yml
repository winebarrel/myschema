# LIST COLUMNS counterpart to
# `partition_list_value_overlap_errors.yml`. The overlap
# guard (`findDuplicateListValue`) keys values via
# `sqlparser.String`, which is tuple-safe in principle, but
# without a LIST COLUMNS pin a regression in tuple
# formatting / equality could let the same tuple
# `(1, 'A')` end up assigned to two partitions and only
# surface as MySQL Error 1495 at apply time. Pins that the
# diff layer rejects the desired-side overlap with the same
# actionable plan-time error for tuple LIST values.
init: |
  CREATE TABLE accts (
      a INT NOT NULL,
      b INT NOT NULL,
      PRIMARY KEY (a, b)
  ) PARTITION BY LIST COLUMNS(a, b) (
      PARTITION p0 VALUES IN ((1, 1)),
      PARTITION p1 VALUES IN ((2, 2))
  );

desired: |
  CREATE TABLE accts (
      a INT NOT NULL,
      b INT NOT NULL,
      PRIMARY KEY (a, b)
  ) PARTITION BY LIST COLUMNS(a, b) (
      PARTITION p0 VALUES IN ((1, 1), (3, 3)),
      PARTITION p1 VALUES IN ((2, 2), (3, 3))
  );

error: 'desired LIST partition definitions assign value (3, 3) to both partition p0 and partition p1'
