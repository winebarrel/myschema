# HASH count shrink: catalog PARTITIONS 8, desired PARTITIONS 4
# + `--allow-drop=partition` → ALTER TABLE … COALESCE PARTITION 4.
# COALESCE merges the trailing partitions into the survivors
# and redistributes their rows (no row loss), but the slot
# structure itself goes away irreversibly — same
# `allow_drop=partition` gating as RANGE/LIST DROP PARTITION.
init: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      PRIMARY KEY (id)
  ) PARTITION BY HASH (id) PARTITIONS 8;

desired: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      PRIMARY KEY (id)
  ) PARTITION BY HASH (id) PARTITIONS 4;

allow_drop:
  - partition

plan: |
  ALTER TABLE myschema_test.events COALESCE PARTITION 4;
