# Pin the partition-key-column rename rejection: MySQL itself
# refuses RENAME COLUMN on a column the PARTITION BY expression
# depends on (Error 3855), so myschema must surface the conflict
# at plan time rather than emit an executable-looking RENAME
# COLUMN that the apply step will always reject. The user has
# to remove the partition dependency first (REMOVE PARTITIONING
# + new PARTITION BY) by hand, then re-run plan.
init: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      old_dt DATE NOT NULL,
      PRIMARY KEY (id, old_dt)
  ) PARTITION BY RANGE (YEAR(old_dt)) (
      PARTITION p2020 VALUES LESS THAN (2021),
      PARTITION p2021 VALUES LESS THAN (2022)
  );

desired: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      -- myschema:renamed-from old_dt
      dt DATE NOT NULL,
      PRIMARY KEY (id, dt)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2020 VALUES LESS THAN (2021),
      PARTITION p2021 VALUES LESS THAN (2022)
  );

error: "conflict with the partition expression"
