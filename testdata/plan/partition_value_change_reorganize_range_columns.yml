# RANGE COLUMNS counterpart to the value-change REORGANIZE
# fixtures. Tuple boundaries `VALUES LESS THAN (a, b)` flow
# through parser.FormatPartitionDefinition the same way scalar
# values do. The end-to-end pin (apply + verify_no_drift) lives
# in testdata/apply/partition_value_change_reorganize_range_columns.yml;
# this file is the plan-side mirror that asserts the exact
# generated SQL.
init: |
  CREATE TABLE shards (
      a INT NOT NULL,
      b INT NOT NULL,
      PRIMARY KEY (a, b)
  ) PARTITION BY RANGE COLUMNS(a, b) (
      PARTITION p0 VALUES LESS THAN (10, 100),
      PARTITION p1 VALUES LESS THAN (20, 200)
  );

desired: |
  CREATE TABLE shards (
      a INT NOT NULL,
      b INT NOT NULL,
      PRIMARY KEY (a, b)
  ) PARTITION BY RANGE COLUMNS(a, b) (
      PARTITION p0 VALUES LESS THAN (15, 150),
      PARTITION p1 VALUES LESS THAN (25, 250)
  );

plan: |
  ALTER TABLE shards REORGANIZE PARTITION p0, p1 INTO (
    partition p0 values less than (15, 150),
    partition p1 values less than (25, 250)
  );
