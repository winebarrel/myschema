# Retention-roll-forward: drop the oldest partition AND add the
# newest in the same plan. Catalog [p2020, p2021] → desired
# [p2021, p2022]. Drop and add name sets are disjoint, so the
# diff emits two ordinary statements (DROP PARTITION p2020 +
# ADD PARTITION p2022) rather than the REORGANIZE error. MySQL
# runs them in order. `--allow-drop=partition` is required
# for the DROP half.
init: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      dt DATE NOT NULL,
      PRIMARY KEY (id, dt)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2020 VALUES LESS THAN (2021),
      PARTITION p2021 VALUES LESS THAN (2022)
  );

desired: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      dt DATE NOT NULL,
      PRIMARY KEY (id, dt)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2021 VALUES LESS THAN (2022),
      PARTITION p2022 VALUES LESS THAN (2023)
  );

allow_drop:
  - partition

plan: |
  ALTER TABLE myschema_test.events ADD PARTITION (
    partition p2022 values less than (2023)
  );
  ALTER TABLE myschema_test.events DROP PARTITION p2020;
