# Drop-side counterpart to
# `partition_key_rename_clause_unchanged_errors` (rename-side):
# MySQL Error 3855 covers both rename AND drop of a column the
# PARTITION BY expression depends on. The desired CREATE TABLE
# here omits the partition-key column entirely; the diff's
# drop-conflict guard rejects the implicit DROP COLUMN at plan
# time so the apply doesn't ship an ALTER MySQL would always
# reject. `--allow-drop=column` is set — without it the DROP
# would land on the disallowed bucket and the guard wouldn't
# need to run (see `partition_key_drop_disallowed`).
init: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      dt DATE NOT NULL,
      PRIMARY KEY (id, dt)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2020 VALUES LESS THAN (2021),
      PARTITION p2021 VALUES LESS THAN (2022)
  );

desired: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      PRIMARY KEY (id)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2020 VALUES LESS THAN (2021),
      PARTITION p2021 VALUES LESS THAN (2022)
  );

allow_drop:
  - column

error: "conflict with the partition expression"
