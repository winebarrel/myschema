# Counterpart to partition_key_rename_conflict_errors but for
# DROP COLUMN: MySQL Error 3855 covers both rename AND drop of a
# column the PARTITION BY expression depends on. The desired
# CREATE TABLE here omits the partition-key column entirely; the
# diff's drop-conflict guard rejects the implicit DROP COLUMN at
# plan time so the apply doesn't ship an ALTER MySQL would
# always reject.
init: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      dt DATE NOT NULL,
      PRIMARY KEY (id, dt)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2020 VALUES LESS THAN (2021),
      PARTITION p2021 VALUES LESS THAN (2022)
  );

desired: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      PRIMARY KEY (id)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2020 VALUES LESS THAN (2021),
      PARTITION p2021 VALUES LESS THAN (2022)
  );

allow_drop:
  - column

error: "conflict with the partition expression"
