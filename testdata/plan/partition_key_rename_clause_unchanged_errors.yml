# Edge case: a `-- myschema:renamed-from` on a partition-key
# column where the desired-side PARTITION BY clause was *not*
# updated to use the new column name. partitionHeaderEqual
# reports clauses equal so diffPartitions is a no-op and
# wouldn't flag anything; the column-rename pass would emit
# `RENAME COLUMN old_dt TO dt`, which MySQL then rejects with
# Error 3855 (the partition expression still references
# old_dt). The reachable rename-conflict guard catches this at
# plan time so apply never runs.
init: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      old_dt DATE NOT NULL,
      PRIMARY KEY (id, old_dt)
  ) PARTITION BY RANGE (YEAR(old_dt)) (
      PARTITION p2020 VALUES LESS THAN (2021)
  );

desired: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      -- myschema:renamed-from old_dt
      dt DATE NOT NULL,
      PRIMARY KEY (id, old_dt)
  ) PARTITION BY RANGE (YEAR(old_dt)) (
      PARTITION p2020 VALUES LESS THAN (2021)
  );

error: "conflict with the partition expression"
