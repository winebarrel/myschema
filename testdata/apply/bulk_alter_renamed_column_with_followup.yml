# Coverage: --bulk-alter does NOT fold RENAME COLUMN with surrounding
# same-table specs. Within one ALTER, MySQL resolves spec-target
# identifiers (`MODIFY COLUMN <name>`, `DROP INDEX <name>`, …) against
# the *original* table state — so a follow-on spec referring to the
# renamed object by its new name would fail at apply time (`Error
# 1054 Unknown column …` for the column case, the matching index
# error code for the index case). To stay safe, splitCombinableAlter
# rejects any spec starting with `RENAME COLUMN` / `RENAME INDEX`, so
# renames keep their own ALTER even under --bulk-alter.
#
# This fixture pins that the rename and the column add stay as two
# separate ALTERs and the round-trip still closes.

init: |
  CREATE TABLE users (
      id BIGINT NOT NULL,
      old_name VARCHAR(64) NOT NULL,
      PRIMARY KEY (id)
  );

desired: |
  CREATE TABLE users (
      id BIGINT NOT NULL,
      -- myschema:renamed-from old_name
      name VARCHAR(64) NOT NULL,
      email VARCHAR(255),
      PRIMARY KEY (id)
  );

bulk_alter: true

applied: |
  ALTER TABLE users RENAME COLUMN old_name TO name;
  ALTER TABLE users ADD COLUMN email varchar(255) AFTER name;

verify_no_drift: true
