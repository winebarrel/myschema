# Coverage: --bulk-alter folds RENAME COLUMN into a multi-spec ALTER
# alongside other same-table changes. The diff layer rewrites column
# refs (FK Columns, FK RefCols, PK columns, index parts) when a column
# is renamed, but a multi-spec `ALTER TABLE … RENAME COLUMN a TO b,
# ADD COLUMN c …;` puts MySQL in charge of the within-statement
# evaluation order. This fixture pins that:
#   - the combined ALTER applies cleanly (MySQL accepts RENAME COLUMN
#     followed by ADD COLUMN in one alter_specifications list),
#   - and the round-trip closes (verify_no_drift: true).

init: |
  CREATE TABLE users (
      id BIGINT NOT NULL,
      old_name VARCHAR(64) NOT NULL,
      PRIMARY KEY (id)
  );

desired: |
  CREATE TABLE users (
      id BIGINT NOT NULL,
      -- myschema:renamed-from old_name
      name VARCHAR(64) NOT NULL,
      email VARCHAR(255),
      PRIMARY KEY (id)
  );

bulk_alter: true

applied: |
  ALTER TABLE users RENAME COLUMN old_name TO name, ADD COLUMN email varchar(255) AFTER name;

verify_no_drift: true
