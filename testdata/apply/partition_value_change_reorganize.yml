# End-to-end pin for the REORGANIZE PARTITION value-change
# path. Diff emits the REORGANIZE; apply runs it; verify_no_drift
# confirms the next plan reports no changes.
init: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      dt DATE NOT NULL,
      PRIMARY KEY (id, dt)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2020 VALUES LESS THAN (2021),
      PARTITION p2021 VALUES LESS THAN (2022)
  );

desired: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      dt DATE NOT NULL,
      PRIMARY KEY (id, dt)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2020 VALUES LESS THAN (2025),
      PARTITION p2021 VALUES LESS THAN (2026)
  );

applied: |
  ALTER TABLE events REORGANIZE PARTITION p2020, p2021 INTO (
    partition p2020 values less than (2025),
    partition p2021 values less than (2026)
  );

verify_no_drift: true
