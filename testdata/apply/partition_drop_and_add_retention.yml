# End-to-end pin for the retention-roll-forward shape: drop the
# oldest + add the newest in one plan. MySQL accepts the two
# generated statements in order; verify_no_drift confirms
# convergence.
init: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      dt DATE NOT NULL,
      PRIMARY KEY (id, dt)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2020 VALUES LESS THAN (2021),
      PARTITION p2021 VALUES LESS THAN (2022)
  );

desired: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      dt DATE NOT NULL,
      PRIMARY KEY (id, dt)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2021 VALUES LESS THAN (2022),
      PARTITION p2022 VALUES LESS THAN (2023)
  );

allow_drop:
  - partition

applied: |
  ALTER TABLE myschema_test.events ADD PARTITION (
    partition p2022 values less than (2023)
  );
  ALTER TABLE myschema_test.events DROP PARTITION p2020;

verify_no_drift: true
