# RANGE counterpart to the LIST option-only REORGANIZE pin. The
# RANGE branch in diffPartitions extends `last` by one slot to
# pull in the next partition whenever the boundary cascade
# requires it (changing slot i's `VALUES LESS THAN <x>` silently
# moves slot i+1's implicit lower bound). For a *boundary* edit
# that extension is required; for a metadata-only edit (COMMENT /
# MAX_ROWS / TABLESPACE) no boundary moved, so pulling p_{i+1}
# into the REORGANIZE just to restate it unchanged turns a
# metadata-only edit into a second partition rewrite. This
# fixture pins the narrower behaviour: only the slot whose
# COMMENT actually changed shows up in the REORGANIZE.
init: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      dt DATE NOT NULL,
      PRIMARY KEY (id, dt)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2020 VALUES LESS THAN (2021) COMMENT 'old',
      PARTITION p2021 VALUES LESS THAN (2022)
  );

desired: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      dt DATE NOT NULL,
      PRIMARY KEY (id, dt)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2020 VALUES LESS THAN (2021) COMMENT 'new',
      PARTITION p2021 VALUES LESS THAN (2022)
  );

applied: |
  ALTER TABLE events REORGANIZE PARTITION p2020 INTO (
    partition p2020 values less than (2021) comment 'new'
  );

verify_no_drift: true
