# End-to-end pin for the multi-partition DROP path. The plan
# fixture (partition_drop_with_allow_multi) pins the format
# string but only the apply path proves MySQL accepts the
# comma-joined name list. Two trailing partitions trimmed in one
# ALTER, verify_no_drift then confirms convergence.
init: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      dt DATE NOT NULL,
      PRIMARY KEY (id, dt)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2020 VALUES LESS THAN (2021),
      PARTITION p2021 VALUES LESS THAN (2022),
      PARTITION p2022 VALUES LESS THAN (2023)
  );

desired: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      dt DATE NOT NULL,
      PRIMARY KEY (id, dt)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2020 VALUES LESS THAN (2021)
  );

allow_drop:
  - partition

applied: |
  ALTER TABLE myschema_test.events DROP PARTITION p2021, p2022;

verify_no_drift: true
