# End-to-end pin for the HASH-grow path. Catalog has 4
# partitions; desired wants 8. The diff plans
# `ALTER TABLE … ADD PARTITION PARTITIONS 4`; apply runs it;
# verify_no_drift confirms the next plan is clean.
init: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      PRIMARY KEY (id)
  ) PARTITION BY HASH (id) PARTITIONS 4;

desired: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      PRIMARY KEY (id)
  ) PARTITION BY HASH (id) PARTITIONS 8;

applied: |
  ALTER TABLE myschema_test.events ADD PARTITION PARTITIONS 4;

verify_no_drift: true
