# End-to-end pin for the multi-partition ADD PARTITION builder.
# Plan-only fixtures pin the format string but only the apply
# path proves MySQL accepts the comma+newline-joined definition
# list. Two partitions added in one ALTER, verify_no_drift then
# confirms convergence in a single apply.
init: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      dt DATE NOT NULL,
      PRIMARY KEY (id, dt)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2020 VALUES LESS THAN (2021)
  );

desired: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      dt DATE NOT NULL,
      PRIMARY KEY (id, dt)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2020 VALUES LESS THAN (2021),
      PARTITION p2021 VALUES LESS THAN (2022),
      PARTITION p2022 VALUES LESS THAN (2023)
  );

applied: |
  ALTER TABLE events ADD PARTITION (
    partition p2021 values less than (2022),
    partition p2022 values less than (2023)
  );

verify_no_drift: true
