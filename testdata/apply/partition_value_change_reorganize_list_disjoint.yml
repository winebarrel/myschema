# LIST disjoint *pure-addition* edits emit one REORGANIZE per
# run of consecutive changed slots. The diff layer detects
# this by checking that every changed slot's NEW
# `VALUES IN (…)` is a *superset* of its OLD set — when no
# value leaves any slot, no value can flow to a different
# slot, so per-run REORGANIZE is safe (no MySQL Error 1495
# "Multiple definition of same constant in list partitioning"
# risk). The matched in-betweens (here p1, p2) stay alone, so
# a tiny endpoint change doesn't drag the whole table through
# a data-moving rewrite.
#
# Cross-flow shapes (a value moves from one partition to
# another) trip the pure-addition check and fall back to a
# single-span REORGANIZE — see
# `partition_value_change_reorganize_list_crossflow.yml` for
# the cross-flow pin and `appendAlterHints` for the related
# parser-quirk fix.
init: |
  CREATE TABLE accts (
      id INT NOT NULL,
      region INT NOT NULL,
      PRIMARY KEY (id, region)
  ) PARTITION BY LIST (region) (
      PARTITION p0 VALUES IN (1, 2),
      PARTITION p1 VALUES IN (3, 4),
      PARTITION p2 VALUES IN (5, 6),
      PARTITION p3 VALUES IN (7, 8)
  );

desired: |
  CREATE TABLE accts (
      id INT NOT NULL,
      region INT NOT NULL,
      PRIMARY KEY (id, region)
  ) PARTITION BY LIST (region) (
      PARTITION p0 VALUES IN (1, 2, 9),
      PARTITION p1 VALUES IN (3, 4),
      PARTITION p2 VALUES IN (5, 6),
      PARTITION p3 VALUES IN (7, 8, 10)
  );

applied: |
  ALTER TABLE accts REORGANIZE PARTITION p0 INTO (
    partition p0 values in (1, 2, 9)
  );
  ALTER TABLE accts REORGANIZE PARTITION p3 INTO (
    partition p3 values in (7, 8, 10)
  );

verify_no_drift: true
