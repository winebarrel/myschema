# Disjoint per-partition diffs on a LIST table emit *one
# single-span REORGANIZE* covering [first..last], not one
# REORGANIZE per run. The reason isn't Error 1519 (that fires
# on consecutive-ordering inside a single statement, which
# multiple statements would each satisfy) — it's that LIST
# values can cross-flow between non-consecutive partitions,
# and a per-run REORGANIZE would break MySQL's value-
# uniqueness rule (Error 1495 "Multiple definition of same
# constant in list partitioning") on the first statement
# while a still-untouched partition still owns the value.
# See partition_value_change_reorganize_list_crossflow.yml
# for the actual cross-flow case the single span fixes.
#
# This fixture pins the *no-cross-flow* shape (p0 + p3 each
# add an independent new value) — the diff has to use the
# same single-span output anyway because cross-flow detection
# would just add complexity for no behaviour difference here:
# myschema picks single-span for every LIST run pattern.
init: |
  CREATE TABLE accts (
      id INT NOT NULL,
      region INT NOT NULL,
      PRIMARY KEY (id, region)
  ) PARTITION BY LIST (region) (
      PARTITION p0 VALUES IN (1, 2),
      PARTITION p1 VALUES IN (3, 4),
      PARTITION p2 VALUES IN (5, 6),
      PARTITION p3 VALUES IN (7, 8)
  );

desired: |
  CREATE TABLE accts (
      id INT NOT NULL,
      region INT NOT NULL,
      PRIMARY KEY (id, region)
  ) PARTITION BY LIST (region) (
      PARTITION p0 VALUES IN (1, 2, 9),
      PARTITION p1 VALUES IN (3, 4),
      PARTITION p2 VALUES IN (5, 6),
      PARTITION p3 VALUES IN (7, 8, 10)
  );

applied: |
  ALTER TABLE myschema_test.accts REORGANIZE PARTITION p0, p1, p2, p3 INTO (
    partition p0 values in (1, 2, 9),
    partition p1 values in (3, 4),
    partition p2 values in (5, 6),
    partition p3 values in (7, 8, 10)
  );

verify_no_drift: true
