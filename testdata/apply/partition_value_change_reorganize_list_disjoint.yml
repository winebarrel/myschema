# Disjoint per-partition diffs become *one REORGANIZE per run*
# of consecutive changed slots — not one giant REORGANIZE that
# restates every matched partition in between. MySQL's Error
# 1519 ("When reorganizing a set of partitions they must be in
# consecutive order") only requires the partition_names list
# *within a single REORGANIZE statement* to be consecutive; it
# doesn't say anything about how many REORGANIZE statements you
# can issue in sequence. So a "p0 + p3 changed" 4-partition
# table emits two separate REORGANIZEs (each trivially
# consecutive — one slot apiece), keeping the rewrite
# proportional to the diff instead of dragging p1 / p2 through
# a data-moving rewrite they don't need.
init: |
  CREATE TABLE accts (
      id INT NOT NULL,
      region INT NOT NULL,
      PRIMARY KEY (id, region)
  ) PARTITION BY LIST (region) (
      PARTITION p0 VALUES IN (1, 2),
      PARTITION p1 VALUES IN (3, 4),
      PARTITION p2 VALUES IN (5, 6),
      PARTITION p3 VALUES IN (7, 8)
  );

desired: |
  CREATE TABLE accts (
      id INT NOT NULL,
      region INT NOT NULL,
      PRIMARY KEY (id, region)
  ) PARTITION BY LIST (region) (
      PARTITION p0 VALUES IN (1, 2, 9),
      PARTITION p1 VALUES IN (3, 4),
      PARTITION p2 VALUES IN (5, 6),
      PARTITION p3 VALUES IN (7, 8, 10)
  );

applied: |
  ALTER TABLE myschema_test.accts REORGANIZE PARTITION p0 INTO (
    partition p0 values in (1, 2, 9)
  );
  ALTER TABLE myschema_test.accts REORGANIZE PARTITION p3 INTO (
    partition p3 values in (7, 8, 10)
  );

verify_no_drift: true
