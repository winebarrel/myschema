# LIST COLUMNS counterpart to the value-change REORGANIZE
# end-to-end fixtures. The same `ListType` branch handles
# `LIST COLUMNS(a, b)` partitions whose `VALUES IN (…)` is a
# list of tuples, but until this fixture there was no plan or
# apply pin proving that ParsePartitionClause /
# FormatPartitionDefinition preserve the tuple-`VALUES IN`
# syntax through the REORGANIZE round-trip or that MySQL
# accepts the generated statement.
init: |
  CREATE TABLE accts (
      a INT NOT NULL,
      b INT NOT NULL,
      PRIMARY KEY (a, b)
  ) PARTITION BY LIST COLUMNS(a, b) (
      PARTITION p0 VALUES IN ((1, 1), (2, 2)),
      PARTITION p1 VALUES IN ((3, 3), (4, 4))
  );

desired: |
  CREATE TABLE accts (
      a INT NOT NULL,
      b INT NOT NULL,
      PRIMARY KEY (a, b)
  ) PARTITION BY LIST COLUMNS(a, b) (
      PARTITION p0 VALUES IN ((1, 1), (2, 2), (5, 5)),
      PARTITION p1 VALUES IN ((3, 3), (4, 4))
  );

applied: |
  ALTER TABLE myschema_test.accts REORGANIZE PARTITION p0 INTO (
    partition p0 values in ((1, 1), (2, 2), (5, 5))
  );

verify_no_drift: true
