# `--alter-algorithm=INSTANT` on a regular ADD COLUMN.
# AGENTS.md "In scope" lists `--alter-algorithm` /
# `--alter-lock` flags. Existing partition-op fixtures pin
# the leading-position splice for partition operations
# (REORGANIZE / ADD / DROP / COALESCE PARTITION); this
# fixture pins the trailing-comma splice for the much more
# common column-level ALTER. MySQL 8.0+ supports INSTANT for
# ADD COLUMN with row-format=DYNAMIC, so the apply runs
# without rebuilding the table.
#
# `--alter-lock` is *not* set on this fixture: MySQL rejects
# `ALGORITHM=INSTANT` combined with any explicit `LOCK=…`
# (Error 1221 "Incorrect usage of ALGORITHM=INSTANT and
# LOCK=…"). The lock-splice path is exercised by the
# plan-side fixture `testdata/plan/alter_hints.yml` (which
# pins both `ALGORITHM=…, LOCK=…` together for non-INSTANT
# algorithms) and by the partition-op apply fixtures for the
# leading-position splice.
init: |
  CREATE TABLE t (
      id INT NOT NULL,
      PRIMARY KEY (id)
  );

desired: |
  CREATE TABLE t (
      id INT NOT NULL,
      flag TINYINT(1) NOT NULL DEFAULT 0,
      PRIMARY KEY (id)
  );

alter_algorithm: INSTANT

applied: |
  ALTER TABLE myschema_test.t ADD COLUMN flag tinyint(1) NOT NULL DEFAULT 0 AFTER id, ALGORITHM=INSTANT;

verify_no_drift: true
