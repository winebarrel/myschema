# End-to-end pin for the column-rename pass on a partitioned
# table — the renamed column is *not* in the partition clause, so
# rewritePartitionColumnRefs runs over the AST as a no-op while
# the rest of the table-diff pipeline emits a clean RENAME
# COLUMN. verify_no_drift then confirms convergence in one
# apply.
#
# Note: MySQL itself rejects renaming a column that the
# `PARTITION BY` expression depends on (Error 3855:
# "Column ... has a partitioning function dependency and cannot
# be dropped or renamed"), so the partition-key rename case is
# pinned plan-side only by partition_no_diff_with_column_rename
# — exercising rewritePartitionColumnRefs's actual rewrite path
# requires a server-side workaround that v1 doesn't generate.
init: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      old_payload TEXT,
      dt DATE NOT NULL,
      PRIMARY KEY (id, dt)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2020 VALUES LESS THAN (2021),
      PARTITION p2021 VALUES LESS THAN (2022)
  );

desired: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      -- myschema:renamed-from old_payload
      payload TEXT,
      dt DATE NOT NULL,
      PRIMARY KEY (id, dt)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2020 VALUES LESS THAN (2021),
      PARTITION p2021 VALUES LESS THAN (2022)
  );

applied: |
  ALTER TABLE myschema_test.events RENAME COLUMN old_payload TO payload;

verify_no_drift: true
