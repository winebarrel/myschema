init: |
  CREATE TABLE users (
      id BIGINT NOT NULL,
      name VARCHAR(64),
      PRIMARY KEY (id)
  );

# `display` references `base`. Alphabetically `display` would come first,
# but topo-sort must put `base` first so `display` can resolve `id`.
desired: |
  CREATE TABLE users (
      id BIGINT NOT NULL,
      name VARCHAR(64),
      PRIMARY KEY (id)
  );
  CREATE VIEW display AS SELECT id, name FROM base;
  CREATE VIEW base    AS SELECT id, name FROM users;

applied: |
  CREATE OR REPLACE VIEW base AS select id, `name` from users;
  CREATE OR REPLACE VIEW display AS select id, `name` from base;
