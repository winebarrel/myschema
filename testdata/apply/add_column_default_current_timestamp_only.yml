# DEFAULT CURRENT_TIMESTAMP without ON UPDATE — the
# "created_at" half of the common created/updated pair.
# Companion to `add_column_on_update_current_timestamp.yml`
# which exercises the ON UPDATE side. Pin that the
# DEFAULT-only path round-trips through the catalog
# (`COLUMN_DEFAULT = 'CURRENT_TIMESTAMP'`,
# `EXTRA = 'DEFAULT_GENERATED'`) and that
# `parser.normalizeDefaultExpr` strips the empty parens
# (`current_timestamp()` → `CURRENT_TIMESTAMP`) so the two
# sides compare equal.
init: |
  CREATE TABLE t (
      id INT NOT NULL,
      PRIMARY KEY (id)
  );

desired: |
  CREATE TABLE t (
      id INT NOT NULL,
      created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
      PRIMARY KEY (id)
  );

applied: |
  ALTER TABLE myschema_test.t ADD COLUMN created_at datetime NOT NULL DEFAULT CURRENT_TIMESTAMP AFTER id;

verify_no_drift: true
