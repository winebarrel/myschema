# End-to-end pin for the new partition DROP path. Catalog has
# three RANGE partitions; desired removes the trailing one,
# allow_drop=partition unblocks the DROP. apply runs it, second
# plan reports no drift.
init: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      dt DATE NOT NULL,
      PRIMARY KEY (id, dt)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2020 VALUES LESS THAN (2021),
      PARTITION p2021 VALUES LESS THAN (2022),
      PARTITION p2022 VALUES LESS THAN (2023)
  );

desired: |
  CREATE TABLE events (
      id BIGINT NOT NULL,
      dt DATE NOT NULL,
      PRIMARY KEY (id, dt)
  ) PARTITION BY RANGE (YEAR(dt)) (
      PARTITION p2020 VALUES LESS THAN (2021),
      PARTITION p2021 VALUES LESS THAN (2022)
  );

allow_drop:
  - partition

applied: |
  ALTER TABLE myschema_test.events DROP PARTITION p2022;

verify_no_drift: true
