# End-to-end pin for ADD PARTITION on a RANGE COLUMNS(a, b)
# table — multi-column tuple values. Plan-only fixture pins the
# format, this pins MySQL acceptance of the multi-tuple
# `VALUES LESS THAN (...)` shape.
init: |
  CREATE TABLE shards (
      a INT NOT NULL,
      b INT NOT NULL,
      PRIMARY KEY (a, b)
  ) PARTITION BY RANGE COLUMNS(a, b) (
      PARTITION p0 VALUES LESS THAN (10, 100),
      PARTITION p1 VALUES LESS THAN (20, 200)
  );

desired: |
  CREATE TABLE shards (
      a INT NOT NULL,
      b INT NOT NULL,
      PRIMARY KEY (a, b)
  ) PARTITION BY RANGE COLUMNS(a, b) (
      PARTITION p0 VALUES LESS THAN (10, 100),
      PARTITION p1 VALUES LESS THAN (20, 200),
      PARTITION p2 VALUES LESS THAN (30, 300)
  );

applied: |
  ALTER TABLE shards ADD PARTITION (
    partition p2 values less than (30, 300)
  );

verify_no_drift: true
