# Replace the PRIMARY KEY (single-column → multi-column).
# AGENTS.md "In scope" lists ADD / DROP CONSTRAINT (PK / CHECK),
# but the modify-PK shape (DROP + ADD in the right order) wasn't
# pinned. Pin it so a regression in the diff layer's PK ordering
# (PK has to drop before re-adding; the two specs go to two
# separate ALTER statements in the default mode) surfaces here.
# Note: under --bulk-alter the same diff folds these two specs
# into one combined `ALTER TABLE t DROP PRIMARY KEY, ADD PRIMARY
# KEY (...);` — MySQL 8.0+ accepts the combined form. See
# bulk_alter_pk_replace.yml for that variant.
init: |
  CREATE TABLE t (
      id INT NOT NULL,
      tenant_id INT NOT NULL,
      PRIMARY KEY (id)
  );

desired: |
  CREATE TABLE t (
      id INT NOT NULL,
      tenant_id INT NOT NULL,
      PRIMARY KEY (tenant_id, id)
  );

applied: |
  ALTER TABLE t DROP PRIMARY KEY;
  ALTER TABLE t ADD PRIMARY KEY (tenant_id, id);

verify_no_drift: true
