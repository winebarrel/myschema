# End-to-end pin for the convergence claim of `-- myschema:convert-charset`.
# Catalog starts on latin1 with a string column that inherits the
# table default; desired flips to utf8mb4 with the directive.
# verify_no_drift: true confirms a *single* apply leaves no
# follow-up plan output — that's the directive's whole point
# vs. the default two-stage flow documented in CAVEATS.md
# "Changing DEFAULT CHARSET".
init: |
  CREATE TABLE t (
      id BIGINT NOT NULL,
      name VARCHAR(64),
      PRIMARY KEY (id)
  ) DEFAULT CHARSET=latin1;

desired: |
  -- myschema:convert-charset
  CREATE TABLE t (
      id BIGINT NOT NULL,
      name VARCHAR(64),
      PRIMARY KEY (id)
  ) DEFAULT CHARSET=utf8mb4;

applied: |
  ALTER TABLE myschema_test.t CONVERT TO CHARACTER SET utf8mb4;

verify_no_drift: true
