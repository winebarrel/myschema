# Negative variant of dependent-index suppression: when only one of an
# index's columns is dropped, MySQL refuses the DROP COLUMN unless the
# index is also dropped. The plan must still emit DROP INDEX.
#
# Note: applied_sql ordering matters — the index drop has to come
# before the column drop, otherwise MySQL rejects the DROP COLUMN.
# myschema currently emits column-then-index, which means *this case
# would still fail at apply time*. The fixture asserts the planned
# output as-is so a follow-up fix to that ordering surfaces in diff.
init: |
  CREATE TABLE users (
      id BIGINT NOT NULL,
      a VARCHAR(64),
      b VARCHAR(64),
      PRIMARY KEY (id),
      KEY i_combined (a, b)
  );

desired: |
  CREATE TABLE users (
      id BIGINT NOT NULL,
      b VARCHAR(64),
      PRIMARY KEY (id),
      KEY i_combined (b)
  );

allow_drop:
  - all

# Drop column 'a' AND replace the index with a single-column form. The
# old index gets re-created since (a, b) ≠ (b).
verify_no_drift: false
applied: |
  ALTER TABLE myschema_test.users DROP COLUMN a;
  ALTER TABLE myschema_test.users DROP INDEX i_combined;
  CREATE INDEX i_combined ON myschema_test.users (b);
