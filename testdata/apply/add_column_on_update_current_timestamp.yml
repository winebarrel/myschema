# `TIMESTAMP / DATETIME … ON UPDATE CURRENT_TIMESTAMP`
# column. Catalog stores the auto-update marker as
# `EXTRA = 'on update CURRENT_TIMESTAMP'` (lower-case) and
# the parser side has to format the AST back to that exact
# shape. AGENTS.md "In scope" lists ON UPDATE; pin the
# round-trip so a regression in either side surfaces here.
init: |
  CREATE TABLE t (
      id INT NOT NULL,
      PRIMARY KEY (id)
  );

desired: |
  CREATE TABLE t (
      id INT NOT NULL,
      updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
      PRIMARY KEY (id)
  );

applied: |
  ALTER TABLE myschema_test.t ADD COLUMN updated_at datetime NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP AFTER id;

verify_no_drift: true
