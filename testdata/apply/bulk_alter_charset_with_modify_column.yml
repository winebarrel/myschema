# Coverage: --bulk-alter folds a DEFAULT CHARSET change with a same-
# table MODIFY COLUMN into one ALTER. Counterpart to
# bulk_alter_charset_with_column_change.yml (which covered the
# CHARSET + ADD COLUMN shape). The MODIFY-COLUMN path is more
# fragile because string columns inherit the table charset only
# when their explicit per-column charset metadata isn't already
# pinned to the *previous* table default — see CAVEATS.md
# "Changing DEFAULT CHARSET on a table with string columns" for the
# two-apply convergence rule (verify_no_drift: false matches
# change_table_charset.yml's baseline; bulk-alter doesn't change
# the convergence shape).
#
# This fixture pins that the combined first-apply ALTER syntactically
# applies — a regression in the diff_all.go bucket order
# (tableCharsetCollationSQL before diffColumns) or in the combiner's
# fold of those two specs would surface here.

init: |
  CREATE TABLE t (
      id BIGINT NOT NULL,
      name VARCHAR(64),
      PRIMARY KEY (id)
  ) DEFAULT CHARSET=utf8mb4;

desired: |
  CREATE TABLE t (
      id BIGINT NOT NULL,
      name VARCHAR(128),
      PRIMARY KEY (id)
  ) DEFAULT CHARSET=latin1;

bulk_alter: true

applied: |
  ALTER TABLE t DEFAULT CHARSET=latin1, MODIFY COLUMN name varchar(128);

verify_no_drift: false
