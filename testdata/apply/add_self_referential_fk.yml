# Self-referential FK (e.g. employee.manager_id → employee.id).
# Both child Columns and parent RefCols name the same table,
# which exercises the same-table FK column-rename rewrite path
# in `diff/tables.go` indirectly (no rename here, but the FK
# resolution must not double-count the dependency). Pin the
# happy path so a regression in same-table FK handling
# surfaces here.
init: |
  CREATE TABLE employees (
      id INT NOT NULL,
      manager_id INT,
      PRIMARY KEY (id),
      KEY idx_manager_id (manager_id)
  );

desired: |
  CREATE TABLE employees (
      id INT NOT NULL,
      manager_id INT,
      PRIMARY KEY (id),
      KEY idx_manager_id (manager_id),
      CONSTRAINT fk_manager FOREIGN KEY (manager_id) REFERENCES employees (id) ON DELETE SET NULL
  );

applied: |
  ALTER TABLE employees ADD CONSTRAINT fk_manager FOREIGN KEY (manager_id) REFERENCES employees(id) ON DELETE SET NULL;

verify_no_drift: true
