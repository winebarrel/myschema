init: |
  CREATE TABLE users (
      id BIGINT NOT NULL,
      name VARCHAR(64),
      PRIMARY KEY (id)
  );

# widening varchar should produce MODIFY COLUMN
desired: |
  CREATE TABLE users (
      id BIGINT NOT NULL,
      name VARCHAR(255),
      PRIMARY KEY (id)
  );

applied: |
  ALTER TABLE users MODIFY COLUMN name varchar(255);
