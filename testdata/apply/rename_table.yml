# Table rename via -- myschema:renamed-from. Without the directive the
# diff would emit DROP TABLE old + CREATE TABLE new, destroying data;
# with it, the diff emits ALTER TABLE … RENAME TO and the rows are
# preserved (verify_no_drift confirms the post-apply state matches
# desired).
init: |
  CREATE TABLE old_users (
      id BIGINT NOT NULL,
      name VARCHAR(64) NOT NULL,
      PRIMARY KEY (id)
  );

desired: |
  -- myschema:renamed-from old_users
  CREATE TABLE users (
      id BIGINT NOT NULL,
      name VARCHAR(64) NOT NULL,
      PRIMARY KEY (id)
  );

applied: |
  ALTER TABLE old_users RENAME TO users;

verify_no_drift: true
